name: Validate and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['publication/**']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: integration-files
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/publication/')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integration-files
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/catalog.json dist/rss.xml --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
